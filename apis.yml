name: Garaji
description: Garaji was an online auto-services marketplace based in Dubai, United Arab Emirates,
  founded in 2018, that connected car owners with local workshops for routine maintenance and
  repairs. Customers selected a service and a vetted garage, and a Garaji valet or tow truck
  collected the vehicle, delivered it to the workshop, and returned it once work was complete.
  Garaji was a 500 Global (formerly 500 Startups) portfolio company. The company is permanently
  closed, and its domain garaji.com is now a parked, for-sale listing served via GoDaddy/Afternic
  with no live product or developer surface. This profile is retained as a defunct portfolio-lead
  record; there are no APIs or developer artifacts to enrich.
